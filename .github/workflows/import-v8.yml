name: Import approved v8 once
on:
  push:
    branches: [main]
    paths: ['.import-source.txt']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Import and validate v8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, subprocess, base64
          from pathlib import Path
          subprocess.run(['git','clone','--depth=1','--branch=main','https://github.com/Routemahiro/ato_sukoshi.git','project'],check=True)
          os.chdir('project')
          if not Path('.import-source.txt').exists():
              raise SystemExit(0)
          source=Path('.import-source.txt').read_text().strip()
          print('::add-mask::'+source,flush=True)
          subprocess.run(['python3','scripts/download-import.py'],env=dict(os.environ,SOURCE_URL=source),check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','index.html','src','scripts','tests','docs','validation','README.md','AGENTS.md','package.json','.gitignore'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              subprocess.run(['git','commit','-m','Import confirmed v8 unchanged, with editable sources and validation'],check=True)
              auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
              print('::add-mask::'+auth,flush=True)
              result=subprocess.run(['git','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:main'],capture_output=True,text=True)
              if result.returncode:
                  print(result.stderr.replace(auth,'[redacted]').replace(os.environ['GH_TOKEN'],'[redacted]'))
                  raise RuntimeError('Push failed; no force push attempted.')
          print('Approved v8 imported and verified.')
          PY
